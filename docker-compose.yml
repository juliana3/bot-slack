

services:
  # Servicio de PostgreSQL (nueva BD para producción)
  db:
    image: postgres:16-alpine
    container_name: postgres_db_prod
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"  # Puerto diferente para no conflictuar con la BD de dev
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de la aplicación Flask
  web:
    build: .
    container_name: flask_app_prod
    restart: always
    ports:
      - "4000:4000"
    environment:
      # Conexión a la BD de producción (interna de Docker)
      DATABASE_URL: postgresql://myuser:mypassword@db:5432/postgres
      REPROCESO_URL: http://web:4000/reprocesar_errores
      
      # Slack
      SLACK_TOKEN: ${SLACK_TOKEN}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID}
      SIGNING_SECRET: ${SIGNING_SECRET}
      
      # PeopleForce
      PEOPLEFORCE_URL: ${PEOPLEFORCE_URL}
      PEOPLEFORCE_TOKEN: ${PEOPLEFORCE_TOKEN}
      DOCUMENT_FOLDER_ID_PF: ${DOCUMENT_FOLDER_ID_PF}
      
      # Google Drive
      DRIVE_ID: ${DRIVE_ID}
      DNI_FOLDER_ID: ${DNI_FOLDER_ID}
      CREDS_GOOGLE: ${CREDS_GOOGLE}
      ID_SPREADSHEET: ${ID_SPREADSHEET}
      NO_AUTORIZADOS_FOLDER_ID: ${NO_AUTORIZADOS_FOLDER_ID}
    env_file:
      - .env
    volumes:
      # Sin volumen de código en producción (usa el código de la imagen)
      # Credenciales de Google
      - ./chatbot-people-466623-1ec1f3039c87.json:/app/chatbot-people-466623-1ec1f3039c87.json:ro
    depends_on:
      db:
        condition: service_healthy

  # Servicio para el cron de reproceso
  cron:
    build: .
    container_name: cron_reproceso_prod
    restart: always
    command: python cron_reproceso.py
    environment:
      # Conexión a la BD de producción
      DATABASE_URL: postgresql://myuser:mypassword@db:5432/postgres
      REPROCESO_URL: http://web:4000/reprocesar_errores
      
      # Slack
      SLACK_TOKEN: ${SLACK_TOKEN}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID}
      SIGNING_SECRET: ${SIGNING_SECRET}
      
      # PeopleForce
      PEOPLEFORCE_URL: ${PEOPLEFORCE_URL}
      PEOPLEFORCE_TOKEN: ${PEOPLEFORCE_TOKEN}
      DOCUMENT_FOLDER_ID_PF: ${DOCUMENT_FOLDER_ID_PF}
      
      # Google Drive
      DRIVE_ID: ${DRIVE_ID}
      DNI_FOLDER_ID: ${DNI_FOLDER_ID}
      CREDS_GOOGLE: ${CREDS_GOOGLE}
      ID_SPREADSHEET: ${ID_SPREADSHEET}
      NO_AUTORIZADOS_FOLDER_ID: ${NO_AUTORIZADOS_FOLDER_ID}
    env_file:
      - .env
    volumes:
      # Credenciales de Google
      - ./chatbot-people-466623-1ec1f3039c87.json:/app/chatbot-people-466623-1ec1f3039c87.json:ro
    depends_on:
      - db
      - web

volumes:
  postgres_data_prod: